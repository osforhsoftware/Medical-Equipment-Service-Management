# MESMS isolated vhost.
# Nginx matches by Host header only, so other Next.js sites on this
# server keep their own server_name / ports / document roots.
server {
    listen 80;
    listen [::]:80;
    server_name mems.145-223-23-47.sslip.io;

    root /var/www/mems/frontend/dist;
    index index.html;

    access_log /var/log/nginx/mems_access.log;
    error_log /var/log/nginx/mems_error.log;

    client_max_body_size 15M;
    gzip on;
    gzip_types text/plain text/css text/javascript application/json application/javascript;

    location /api/ {
        proxy_pass http://127.0.0.1:4002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

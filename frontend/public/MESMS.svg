<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" role="img" aria-label="MESMS Medical Equipment Service Management">
  <defs>
    <linearGradient id="mesms-grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="mesms-grad-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="mesms-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0284c7" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Logo Mark (Badge Icon) -->
  <g transform="translate(10, 10)">
    <!-- Base Squircle -->
    <rect x="0" y="0" width="80" height="80" rx="22" fill="url(#mesms-grad-primary)" filter="url(#mesms-shadow)"/>
    
    <!-- Outer Gear Pulse Arc -->
    <path d="M 40,10 A 30,30 0 0,1 70,40" stroke="rgba(255,255,255,0.4)" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="6 4"/>
    <path d="M 40,70 A 30,30 0 0,1 10,40" stroke="rgba(255,255,255,0.4)" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="6 4"/>

    <!-- Medical Cross -->
    <path d="M 40,24 V 56 M 24,40 H 56" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>

    <!-- Heartbeat EKG Pulse Line -->
    <path d="M 20,40 H 31 L 36,28 L 42,52 L 47,35 L 51,43 L 60,40" stroke="url(#mesms-grad-accent)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <!-- Glow node -->
    <circle cx="42" cy="52" r="3" fill="#ffffff"/>
  </g>

  <!-- Typography Suite -->
  <g transform="translate(106, 0)">
    <!-- Primary Brand Title -->
    <text x="0" y="52" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="42" font-weight="900" letter-spacing="3">MESMS</text>

    <!-- Medical Service Subtitle -->
    <text x="2" y="74" fill="#0284c7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2.5">MEDICAL EQUIPMENT SERVICE</text>
  </g>
</svg>
